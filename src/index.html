<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Lights</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.18/paper-full.min.js"></script>
</head>
<body>
    <canvas id="panel"></canvas>
    <div id="interface">
        brightness
        <input type="range" id="brightnessSlider" />
        red
        <input type="range" id="redSlider" />
        green
        <input type="range" id="greenSlider" />
        blue
        <input type="range" id="blueSlider" />
        hue
        <input type="range" id="hueSlider" />
        <br />

        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <input type="text" name="delay" id="delayInput" value="0">
        <input type="text" name="interval" id="intervalInput" value="100">
    </div>
</body>
</html>
